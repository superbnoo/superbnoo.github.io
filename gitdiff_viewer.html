<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Diff Viewer</title>

    <!-- Diff2Html CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css"
    />

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px;
            background: white;
            border-bottom: 1px solid #ddd;
            z-index: 100;
            flex-shrink: 0;
        }

        input[type="file"] {
            font-size: 14px;
        }

        .layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .left-panel {
            width: 280px;
            min-width: 160px;
            max-width: 50vw;
            background: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .left-panel-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 13px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .left-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .left-panel-content .placeholder {
            padding: 24px 16px;
            color: #999;
            font-size: 13px;
            text-align: center;
        }

        /* File tree styles */
        .file-tree {
            font-size: 13px;
            line-height: 1.4;
            padding: 4px 0;
            user-select: none;
        }

        .file-tree ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .file-tree li {
            position: relative;
        }

        .file-tree .tree-row {
            display: flex;
            align-items: center;
            padding: 3px 8px 3px 0;
            cursor: pointer;
            white-space: nowrap;
            border-radius: 3px;
        }

        .file-tree .tree-row:hover {
            background: #f0f4ff;
        }

        .file-tree .tree-row.active {
            background: #e0ecff;
        }

        .file-tree .tree-indent {
            display: inline-block;
            width: 16px;
            flex-shrink: 0;
        }

        .file-tree .tree-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            font-size: 10px;
            color: #888;
            transition: transform 0.15s;
        }

        .file-tree .tree-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .file-tree .tree-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 16px;
            flex-shrink: 0;
            margin-right: 4px;
            font-size: 14px;
        }

        .file-tree .tree-label {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
            color: #333;
        }

        .file-tree .tree-row.is-file .tree-label {
            color: #1a1a1a;
        }

        .file-tree .tree-badge {
            margin-left: auto;
            padding-left: 6px;
            flex-shrink: 0;
            font-size: 11px;
            font-weight: 600;
        }

        .file-tree .badge-add { color: #28a745; }
        .file-tree .badge-del { color: #d73a49; }

        .file-tree .tree-children.hidden {
            display: none;
        }

        /* Hide the original file list inside the diff container */
        #diff > .d2h-file-list-wrapper {
            display: none;
        }

        /* Line numbers should scroll with the code, not stick */
        .d2h-code-side-linenumber {
            position: static !important;
        }

        .resize-handle {
            width: 5px;
            cursor: col-resize;
            background: transparent;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            transition: background 0.15s;
        }

        .resize-handle:hover,
        .resize-handle.active {
            background: #4a9eff;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            overflow-y: auto;
        }

        #diff {
            padding: 16px;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #666;
        }

        body.resizing {
            cursor: col-resize;
            user-select: none;
        }

        body.resizing iframe,
        body.resizing .main-content {
            pointer-events: none;
        }
    </style>
</head>
<body>

<header>
    <input type="file" id="fileInput" accept=".txt,.diff,.patch">
</header>

<div class="layout">
    <div class="left-panel" id="leftPanel">
        <div class="left-panel-header">Files</div>
        <div class="left-panel-content">
            <div class="placeholder">Load a diff to begin.</div>
        </div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <div class="main-content" id="mainContent">
        <div id="diff">
            <div class="empty">
                Select a git diff file to view.
            </div>
        </div>
    </div>
</div>

<!-- Diff2Html JS -->
<script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>

<script>
    const fileInput = document.getElementById("fileInput");
    const diffContainer = document.getElementById("diff");

    fileInput.addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const diffText = await file.text();

        diffContainer.innerHTML = "";

        const configuration = {
            drawFileList: true,
            fileListToggle: true,
            fileListStartVisible: true,
            fileContentToggle: true,
            matching: "lines",
            outputFormat: "side-by-side",
            synchronisedScroll: true,
            highlight: true
        };

        const diff2htmlUi = new Diff2HtmlUI(
            diffContainer,
            diffText,
            configuration
        );

        diff2htmlUi.draw();
        diff2htmlUi.highlightCode();

        // Build a folder tree from the diff file list
        const leftPanelContent = document.querySelector(".left-panel-content");
        const fileEntries = [];
        const fileWrappers = diffContainer.querySelectorAll(".d2h-file-wrapper");
        diffContainer.querySelectorAll(".d2h-file-list-line").forEach((li, idx) => {
            const nameEl = li.querySelector(".d2h-file-name");
            const path = nameEl ? nameEl.textContent.trim() : "";
            const addEl = li.querySelector(".d2h-lines-added");
            const delEl = li.querySelector(".d2h-lines-deleted");
            const added = addEl ? addEl.textContent.trim() : "";
            const deleted = delEl ? delEl.textContent.trim() : "";
            const targetEl = fileWrappers[idx] || null;
            if (path) fileEntries.push({ path, targetEl, added, deleted });
        });

        if (fileEntries.length && leftPanelContent) {
            const tree = buildTree(fileEntries);
            leftPanelContent.innerHTML = "";
            const treeEl = document.createElement("div");
            treeEl.className = "file-tree";
            const ul = document.createElement("ul");
            renderTreeNodes(ul, tree, 0);
            treeEl.appendChild(ul);
            leftPanelContent.appendChild(treeEl);
        }

        function buildTree(entries) {
            const root = {};
            for (const entry of entries) {
                const parts = entry.path.split("/");
                let node = root;
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    if (i === parts.length - 1) {
                        node[part] = { __file: true, path: entry.path, targetEl: entry.targetEl, added: entry.added, deleted: entry.deleted };
                    } else {
                        if (!node[part] || node[part].__file) node[part] = {};
                        node = node[part];
                    }
                }
            }
            return collapseSingleChildFolders(root);
        }

        // Collapse folders that have only one child folder into "parent/child" style
        function collapseSingleChildFolders(node) {
            const result = {};
            for (const [key, value] of Object.entries(node)) {
                if (value.__file) {
                    result[key] = value;
                } else {
                    let collapsed = collapseSingleChildFolders(value);
                    let name = key;
                    while (true) {
                        const childKeys = Object.keys(collapsed);
                        if (childKeys.length === 1 && !collapsed[childKeys[0]].__file) {
                            name += "/" + childKeys[0];
                            collapsed = collapsed[childKeys[0]];
                        } else {
                            break;
                        }
                    }
                    result[name] = collapsed;
                }
            }
            return result;
        }

        function renderTreeNodes(ul, node, depth) {
            const folders = [];
            const files = [];
            for (const [key, value] of Object.entries(node)) {
                if (value.__file) files.push({ name: key, ...value });
                else folders.push({ name: key, children: value });
            }
            folders.sort((a, b) => a.name.localeCompare(b.name));
            files.sort((a, b) => a.name.localeCompare(b.name));

            for (const folder of folders) {
                const li = document.createElement("li");
                const row = document.createElement("div");
                row.className = "tree-row";

                for (let i = 0; i < depth; i++) {
                    const indent = document.createElement("span");
                    indent.className = "tree-indent";
                    row.appendChild(indent);
                }

                const toggle = document.createElement("span");
                toggle.className = "tree-toggle";
                toggle.textContent = "▼";
                row.appendChild(toggle);

                const icon = document.createElement("span");
                icon.className = "tree-icon";
                icon.textContent = "📁";
                row.appendChild(icon);

                const label = document.createElement("span");
                label.className = "tree-label";
                label.textContent = folder.name;
                label.title = folder.name;
                row.appendChild(label);

                li.appendChild(row);

                const childUl = document.createElement("ul");
                childUl.className = "tree-children";
                renderTreeNodes(childUl, folder.children, depth + 1);
                li.appendChild(childUl);

                row.addEventListener("click", () => {
                    childUl.classList.toggle("hidden");
                    toggle.classList.toggle("collapsed");
                });

                ul.appendChild(li);
            }

            for (const f of files) {
                const li = document.createElement("li");
                const row = document.createElement("div");
                row.className = "tree-row is-file";

                for (let i = 0; i < depth; i++) {
                    const indent = document.createElement("span");
                    indent.className = "tree-indent";
                    row.appendChild(indent);
                }

                const spacer = document.createElement("span");
                spacer.className = "tree-indent";
                row.appendChild(spacer);

                const icon = document.createElement("span");
                icon.className = "tree-icon";
                icon.textContent = "📄";
                row.appendChild(icon);

                const label = document.createElement("span");
                label.className = "tree-label";
                label.textContent = f.name;
                label.title = f.path;
                row.appendChild(label);

                if (f.added || f.deleted) {
                    const badge = document.createElement("span");
                    badge.className = "tree-badge";
                    let parts = [];
                    if (f.added) parts.push(`<span class="badge-add">${f.added}</span>`);
                    if (f.deleted) parts.push(`<span class="badge-del">${f.deleted}</span>`);
                    badge.innerHTML = parts.join(" ");
                    row.appendChild(badge);
                }

                row.addEventListener("click", () => {
                    document.querySelectorAll(".file-tree .tree-row.active").forEach(el => el.classList.remove("active"));
                    row.classList.add("active");
                    if (!f.targetEl) return;
                    const mainContent = document.getElementById("mainContent");
                    const top = f.targetEl.getBoundingClientRect().top
                        - mainContent.getBoundingClientRect().top
                        + mainContent.scrollTop;
                    mainContent.scrollTo({ top, behavior: "smooth" });
                });

                li.appendChild(row);
                ul.appendChild(li);
            }
        }
    });

    // Resizable left panel
    const leftPanel = document.getElementById("leftPanel");
    const handle = document.getElementById("resizeHandle");
    let startX, startWidth;

    handle.addEventListener("mousedown", (e) => {
        e.preventDefault();
        startX = e.clientX;
        startWidth = leftPanel.offsetWidth;
        document.body.classList.add("resizing");
        handle.classList.add("active");
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
    });

    function onMouseMove(e) {
        const delta = e.clientX - startX;
        const newWidth = Math.min(
            Math.max(startWidth + delta, 160),
            window.innerWidth * 0.5
        );
        leftPanel.style.width = newWidth + "px";
    }

    function onMouseUp() {
        document.body.classList.remove("resizing");
        handle.classList.remove("active");
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onMouseUp);
    }
</script>

</body>
</html>

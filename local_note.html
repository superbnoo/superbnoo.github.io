<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="main.css">
<style>
  html, body { height: 100%; overflow: hidden; }

  .app {
    display: flex;
    height: 100vh;
  }

  /* ---------- sidebar ---------- */

  .sidebar {
    width: 230px;
    min-width: 180px;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line-soft);
    flex-shrink: 0;
  }

  .sidebar-title {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -.01em;
  }

  .note-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }

  .note-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
    border-left: 3px solid transparent;
    transition: background .1s ease;
  }

  .note-item:hover { background: var(--surface-2); }

  .note-item.active {
    background: var(--a-tint);
    border-left-color: var(--a);
    font-weight: 500;
  }

  .note-item .note-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--sans);
  }

  .note-item .note-title.empty {
    color: var(--muted);
    font-style: italic;
  }

  .note-item .note-delete {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--muted);
    background: none;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .1s ease, color .1s ease;
    padding: 0;
    font-family: var(--sans);
  }

  .note-item:hover .note-delete { opacity: 1; }
  .note-item .note-delete:hover { color: var(--diff); background: var(--diff-tint); }

  .sidebar-foot {
    padding: 10px 16px;
    border-top: 1px solid var(--line-soft);
    flex-shrink: 0;
  }

  .btn-new {
    width: 100%;
    justify-content: center;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 10px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-new:hover { background: var(--a-tint); border-color: var(--a); }
  .btn-new:disabled { opacity: .4; cursor: not-allowed; }
  .btn-new:disabled:hover { background: var(--surface-2); border-color: var(--line); }

  .note-count {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    text-align: center;
    padding-top: 4px;
  }

  /* ---------- editor ---------- */

  .editor-wrap {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    background: var(--bg);
  }

  .editor {
    max-width: 760px;
    margin: 0 auto;
    min-height: 100%;
    padding: 36px 32px 120px;
    outline: none;
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink);
    cursor: text;
    -webkit-font-smoothing: antialiased;
  }

  .editor:empty::before {
    content: "Start typing…";
    color: var(--muted);
    opacity: .55;
    pointer-events: none;
  }

  /* ---------- rich-text formatting inside editor ---------- */

  .editor h1 {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 28px;
    line-height: 1.2;
    margin: 1.2em 0 .4em;
    letter-spacing: -.01em;
  }

  .editor h1:first-child { margin-top: 0; }

  .editor h2 {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.25;
    margin: 1.2em 0 .4em;
    letter-spacing: -.01em;
  }

  .editor h3 {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 17px;
    line-height: 1.3;
    margin: 1em 0 .3em;
  }

  .editor p { margin: 0 0 .6em; }

  .editor ul, .editor ol { padding-left: 1.5em; margin: 0 0 .6em; }
  .editor li { margin-bottom: .2em; }

  .editor blockquote {
    margin: 0 0 .6em;
    padding: 6px 14px;
    border-left: 3px solid var(--a);
    background: var(--a-tint);
    border-radius: 0 4px 4px 0;
  }

  .editor code {
    font-family: var(--mono);
    font-size: .88em;
    background: var(--surface-2);
    border: 1px solid var(--line-soft);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .editor pre {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0 0 .6em;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    color: var(--ink);
  }

  .editor pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: inherit;
  }

  .editor hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 1.2em 0;
  }

  .editor a { color: var(--a); text-decoration: underline; text-underline-offset: 2px; }

  .editor img { max-width: 100%; border-radius: 4px; }

  /* ---------- toolbar hint ---------- */

  .toolbar {
    position: sticky;
    bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--line-soft);
    padding: 6px 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    z-index: 5;
  }

  .toolbar kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 4px;
  }

  @media (max-width: 600px) {
    .sidebar { width: 180px; }
    .editor { padding: 24px 18px 100px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">Notes</div>
    </div>
    <div class="note-list" id="note-list"></div>
    <div class="sidebar-foot">
      <button class="btn-new" id="btn-new" type="button">+ New note</button>
      <div class="note-count" id="note-count"></div>
    </div>
  </div>

  <div class="editor-wrap" id="editor-wrap">
    <div class="editor" id="editor" contenteditable="true"></div>
    <div class="toolbar">
      <span><kbd>⌘B</kbd> bold</span>
      <span><kbd>⌘I</kbd> italic</span>
      <span><kbd>⌘⇧H</kbd> heading</span>
      <span><kbd>⌘⇧7</kbd> list</span>
      <span><kbd>⌘⇧8</kbd> bullet</span>
      <span><kbd>⌘⇧9</kbd> quote</span>
      <span>Markdown shortcuts: <kbd># </kbd> <kbd>- </kbd> <kbd>> </kbd> <kbd>```</kbd></span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "local_notes_v1";
  var MAX_NOTES = 10;
  var TITLE_LEN = 20;
  var SAVE_DEBOUNCE = 400;

  /* ------------------------------------------------------------------ *
   * State                                                               *
   * ------------------------------------------------------------------ */

  var notes = [];
  var activeIdx = 0;
  var saveTimer = null;
  var ignoreInput = false;

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) notes = JSON.parse(raw);
    } catch (e) { /* ignore */ }
    if (!Array.isArray(notes) || !notes.length) {
      notes = [{ html: "" }];
    }
    if (notes.length > MAX_NOTES) notes = notes.slice(0, MAX_NOTES);
    activeIdx = 0;
  }

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); } catch (e) { /* full */ }
  }

  function noteTitle(note) {
    var div = document.createElement("div");
    div.innerHTML = note.html || "";
    var text = (div.textContent || div.innerText || "").trim();
    var firstLine = text.split(/\n/)[0].trim();
    if (!firstLine) return "";
    if (firstLine.length <= TITLE_LEN) return firstLine;
    return firstLine.slice(0, TITLE_LEN) + "\u2026";
  }

  /* ------------------------------------------------------------------ *
   * DOM refs                                                            *
   * ------------------------------------------------------------------ */

  var $list   = document.getElementById("note-list");
  var $editor = document.getElementById("editor");
  var $btnNew = document.getElementById("btn-new");
  var $count  = document.getElementById("note-count");

  /* ------------------------------------------------------------------ *
   * Sidebar                                                             *
   * ------------------------------------------------------------------ */

  function renderList() {
    $list.innerHTML = "";
    notes.forEach(function (note, i) {
      var item = document.createElement("div");
      item.className = "note-item" + (i === activeIdx ? " active" : "");

      var title = document.createElement("span");
      var t = noteTitle(note);
      title.className = "note-title" + (t ? "" : " empty");
      title.textContent = t || "Empty note";
      item.appendChild(title);

      var del = document.createElement("button");
      del.className = "note-delete";
      del.textContent = "\u00d7";
      del.title = "Delete note";
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        deleteNote(i);
      });
      item.appendChild(del);

      item.addEventListener("click", function () { selectNote(i); });
      $list.appendChild(item);
    });

    $btnNew.disabled = notes.length >= MAX_NOTES;
    $count.textContent = notes.length + " / " + MAX_NOTES;
  }

  /* ------------------------------------------------------------------ *
   * Editor                                                              *
   * ------------------------------------------------------------------ */

  function loadEditor() {
    ignoreInput = true;
    $editor.innerHTML = notes[activeIdx].html || "";
    ignoreInput = false;
    $editor.focus();
    placeCaretAtEnd($editor);
  }

  function placeCaretAtEnd(el) {
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /* ------------------------------------------------------------------ *
   * Markdown shortcuts — triggered on Enter and Space                   *
   * ------------------------------------------------------------------ */

  function getBlockAtCaret() {
    var sel = window.getSelection();
    if (!sel.rangeCount) return null;
    var node = sel.anchorNode;
    while (node && node !== $editor) {
      if (node.nodeType === 1 && node.parentNode === $editor) return node;
      node = node.parentNode;
    }
    if (node === $editor && sel.anchorNode.nodeType === 3) {
      return sel.anchorNode.parentNode === $editor ? sel.anchorNode : null;
    }
    return null;
  }

  function getBlockText(block) {
    if (block.nodeType === 3) return block.textContent;
    return block.textContent || "";
  }

  function handleMarkdownShortcut() {
    var sel = window.getSelection();
    if (!sel.rangeCount) return false;

    var block = getBlockAtCaret();
    if (!block) return false;
    var text = getBlockText(block);

    var rules = [
      { pattern: /^# $/, tag: "h1" },
      { pattern: /^## $/, tag: "h2" },
      { pattern: /^### $/, tag: "h3" },
      { pattern: /^[-*] $/, tag: "ul" },
      { pattern: /^1[.)]\s$/, tag: "ol" },
      { pattern: /^> $/, tag: "blockquote" },
      { pattern: /^---$/, tag: "hr" },
      { pattern: /^```$/, tag: "pre" }
    ];

    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      if (r.pattern.test(text)) {
        applyBlock(block, r.tag);
        return true;
      }
    }
    return false;
  }

  function applyBlock(block, tag) {
    if (tag === "hr") {
      var hr = document.createElement("hr");
      var after = document.createElement("p");
      after.innerHTML = "<br>";
      block.parentNode.replaceChild(after, block);
      after.parentNode.insertBefore(hr, after);
      placeCaretAtStart(after);
      return;
    }

    if (tag === "pre") {
      var pre = document.createElement("pre");
      var code = document.createElement("code");
      code.innerHTML = "<br>";
      pre.appendChild(code);
      block.parentNode.replaceChild(pre, block);
      placeCaretAtStart(code);
      return;
    }

    if (tag === "ul" || tag === "ol") {
      var list = document.createElement(tag);
      var li = document.createElement("li");
      li.innerHTML = "<br>";
      list.appendChild(li);
      block.parentNode.replaceChild(list, block);
      placeCaretAtStart(li);
      return;
    }

    if (tag === "blockquote") {
      var bq = document.createElement("blockquote");
      var p = document.createElement("p");
      p.innerHTML = "<br>";
      bq.appendChild(p);
      block.parentNode.replaceChild(bq, block);
      placeCaretAtStart(p);
      return;
    }

    var el = document.createElement(tag);
    el.innerHTML = "<br>";
    block.parentNode.replaceChild(el, block);
    placeCaretAtStart(el);
  }

  function placeCaretAtStart(el) {
    var range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  /* ------------------------------------------------------------------ *
   * Keyboard: formatting commands + markdown triggers                   *
   * ------------------------------------------------------------------ */

  $editor.addEventListener("keydown", function (e) {
    var mod = e.metaKey || e.ctrlKey;

    if (mod && e.key === "b") {
      e.preventDefault();
      document.execCommand("bold");
      return;
    }
    if (mod && e.key === "i") {
      e.preventDefault();
      document.execCommand("italic");
      return;
    }
    if (mod && e.key === "u") {
      e.preventDefault();
      document.execCommand("underline");
      return;
    }

    if (mod && e.shiftKey && e.key === "H") {
      e.preventDefault();
      cycleHeading();
      return;
    }
    if (mod && e.shiftKey && e.key === "&") {
      e.preventDefault();
      document.execCommand("insertOrderedList");
      return;
    }
    if (mod && e.shiftKey && e.key === "*") {
      e.preventDefault();
      document.execCommand("insertUnorderedList");
      return;
    }
    if (mod && e.shiftKey && e.key === "(") {
      e.preventDefault();
      toggleBlockquote();
      return;
    }

    if (mod && e.key === "s") {
      e.preventDefault();
      flushSave();
      return;
    }

    if (e.key === "Tab") {
      e.preventDefault();
      document.execCommand("insertText", false, "  ");
      return;
    }
  });

  $editor.addEventListener("input", function () {
    if (ignoreInput) return;
    handleMarkdownShortcut();
    notes[activeIdx].html = $editor.innerHTML;
    scheduleSave();
  });

  function cycleHeading() {
    var block = getBlockAtCaret();
    if (!block || block.nodeType === 3) {
      document.execCommand("formatBlock", false, "h1");
      return;
    }
    var tag = block.tagName;
    if (tag === "H1") document.execCommand("formatBlock", false, "h2");
    else if (tag === "H2") document.execCommand("formatBlock", false, "h3");
    else if (tag === "H3") document.execCommand("formatBlock", false, "p");
    else document.execCommand("formatBlock", false, "h1");
  }

  function toggleBlockquote() {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var node = sel.anchorNode;
    while (node && node !== $editor) {
      if (node.tagName === "BLOCKQUOTE") {
        var p = document.createElement("p");
        p.innerHTML = node.innerHTML;
        node.parentNode.replaceChild(p, node);
        placeCaretAtEnd(p);
        return;
      }
      node = node.parentNode;
    }
    document.execCommand("formatBlock", false, "blockquote");
  }

  /* ------------------------------------------------------------------ *
   * Note CRUD                                                           *
   * ------------------------------------------------------------------ */

  function selectNote(idx) {
    if (idx === activeIdx) return;
    flushSave();
    activeIdx = idx;
    renderList();
    loadEditor();
  }

  function createNote() {
    if (notes.length >= MAX_NOTES) return;
    flushSave();
    notes.push({ html: "" });
    activeIdx = notes.length - 1;
    persist();
    renderList();
    loadEditor();
  }

  function deleteNote(idx) {
    if (notes.length <= 1) {
      notes[0].html = "";
      activeIdx = 0;
    } else {
      notes.splice(idx, 1);
      if (activeIdx >= notes.length) activeIdx = notes.length - 1;
      else if (activeIdx > idx) activeIdx--;
    }
    persist();
    renderList();
    loadEditor();
  }

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      persist();
      renderList();
    }, SAVE_DEBOUNCE);
  }

  function flushSave() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
    notes[activeIdx].html = $editor.innerHTML;
    persist();
    renderList();
  }

  $btnNew.addEventListener("click", createNote);

  window.addEventListener("beforeunload", flushSave);

  /* click empty area below content to focus editor */
  document.getElementById("editor-wrap").addEventListener("click", function (e) {
    if (e.target === this) {
      $editor.focus();
      placeCaretAtEnd($editor);
    }
  });

  /* ------------------------------------------------------------------ *
   * Init                                                                *
   * ------------------------------------------------------------------ */

  load();
  renderList();
  loadEditor();

})();
</script>

</body>
</html>

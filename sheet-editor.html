<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="main.css">
<style>
  /* ============================================================
     Sheet Editor — page-specific styles
     ============================================================ */

  .line {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 20px;
    overflow-x: auto;
  }

  .chord-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    padding: 8px 0 0;
    min-width: 640px;
  }

  .chord-input {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    padding: 4px 12px;
    text-align: center;
    outline: none;
  }

  .chord-input:hover { border-bottom-color: var(--line); }
  .chord-input:focus { border-bottom-color: var(--a); }

  .note-row {
    display: grid;
    grid-template-columns: repeat(32, 1fr);
    gap: 0;
    min-width: 640px;
    min-height: 38px;
  }

  .cell {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-right: none;
    padding: 8px 0;
    text-align: left;
    cursor: pointer;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    min-height: 38px;
    transition: background .1s ease;
  }

  .cell:last-child { border-right: 1px solid var(--line); }

  .cell.measure-start { border-left: 2px solid var(--muted); }

  .cell:hover { background: var(--a-tint); }

  .cell.has-note { background: var(--surface); font-weight: 600; }
  .cell.has-note:hover { background: var(--a-tint); }

  .note-text {
    display: inline-block;
    text-align: center;
  }

  .cell.selected {
    outline: 2px solid var(--focus);
    outline-offset: -2px;
    z-index: 1;
  }

  .beat-row {
    display: grid;
    grid-template-columns: repeat(32, 1fr);
    gap: 0;
    min-width: 640px;
  }

  .beat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    padding: 2px 0 6px;
  }

  .beat-label.measure-start { border-left: 2px solid transparent; }

  .line-foot {
    display: flex;
    justify-content: flex-end;
    padding: 4px 8px 6px;
  }

  .btn-sm {
    font-size: 11px;
    padding: 3px 10px;
    color: var(--muted);
  }

  .btn-sm:hover { color: var(--diff); border-color: var(--diff); background: var(--diff-tint); }

  input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .popup {
    position: fixed;
    z-index: 100;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .popup[hidden] { display: none; }

  .popup-notes {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .popup-note {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 10px;
    cursor: pointer;
    text-align: center;
    transition: background .1s ease, border-color .1s ease;
  }

  .popup-note:hover { background: var(--a-tint); border-color: var(--a); }

  .popup-accidentals {
    display: flex;
    gap: 4px;
    justify-content: center;
  }

  .popup-acc {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 4px 10px;
    cursor: pointer;
    transition: background .1s ease;
  }

  .popup-acc:hover { background: var(--a-tint); }
  .popup-acc.active { background: var(--a-tint); border-color: var(--a); color: var(--a); }

  .drag-handle {
    position: absolute;
    top: 0;
    right: -2px;
    width: 6px;
    height: 100%;
    cursor: col-resize;
    z-index: 2;
    background: var(--a);
    opacity: 0;
    border-radius: 0 2px 2px 0;
    transition: opacity .15s ease;
  }

  .cell.selected .drag-handle { opacity: 1; }

  .cell.drag-preview { background: var(--a-tint); border-color: var(--a); }

  .measure-divider {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    border-left: 2px dashed var(--muted);
    opacity: 0.5;
    pointer-events: none;
    z-index: 1;
  }

  /* ============================================================
     Mode bar & View title
     ============================================================ */

  .mode-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
  }

  .mode-bar[hidden] { display: none; }

  .view-title {
    font-family: var(--cond);
    font-weight: 700;
    font-size: 32px;
    text-align: center;
    letter-spacing: -.01em;
    padding: 8px 0 16px;
    color: var(--ink);
  }

  .view-title[hidden] { display: none; }

  /* ============================================================
     View mode overrides
     ============================================================ */

  .view-mode #toolbar { display: none; }
  .view-mode header p { display: none; }
  .view-mode .cell { cursor: default; }
  .view-mode .cell:hover { background: var(--surface-2); }
  .view-mode .cell.has-note:hover { background: var(--surface); }
  .view-mode .drag-handle { display: none; }
  .view-mode .line-foot { display: none; }
  .view-mode .popup { display: none !important; }
  .view-mode .chord-input {
    pointer-events: none;
    border-bottom-color: transparent;
    cursor: default;
  }
  .view-mode .chord-input:hover { border-bottom-color: transparent; }
  .view-mode .chord-input:focus { border-bottom-color: transparent; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Music notation</div>
    <h1>Sheet Editor</h1>
    <p>Enter piano sheet music as note letters in a grid. Two rows (treble and bass), eight beats per measure, drag to extend notes.</p>
  </header>

  <div class="panel" id="toolbar">
    <div class="panel-head">
      <span class="panel-label">Sheet</span>
    </div>
    <div class="opts">
      <div class="field">
        <label for="title-input">Song title</label>
        <input type="text" id="title-input" placeholder="Untitled" spellcheck="false">
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="add-line" type="button">+ Add Line</button>
      <span class="spacer"></span>
      <button class="btn" id="export-btn" type="button">Export JSON</button>
      <input type="file" id="import-file" accept=".json,application/json">
      <label class="btn" for="import-file">Import JSON</label>
      <button class="btn primary" id="view-btn" type="button">View</button>
    </div>
  </div>

  <div id="mode-bar" class="mode-bar" hidden>
    <button class="btn" id="edit-btn" type="button">← Edit</button>
    <button class="btn primary" id="print-btn" type="button">Print</button>
  </div>

  <div id="view-title" class="view-title" hidden></div>

  <div id="sheet"></div>

  <div class="popup" id="popup" hidden>
    <div class="popup-notes" id="popup-notes"></div>
    <div class="popup-accidentals">
      <button class="popup-acc" id="acc-natural" type="button">♮</button>
      <button class="popup-acc" id="acc-sharp" type="button">♯</button>
      <button class="popup-acc" id="acc-flat" type="button">♭</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var MEASURES_PER_LINE = 4;
  var CELLS_PER_MEASURE = 8;
  var TOTAL_COLS = MEASURES_PER_LINE * CELLS_PER_MEASURE;
  var BEAT_LABELS = ["1", "n", "2", "n", "3", "n", "4", "n"];

  var state = { title: "", lines: [] };
  var selected = null;

  function createEmptyMeasure() {
    return {
      chord: "",
      treble: [null, null, null, null, null, null, null, null],
      bass: [null, null, null, null, null, null, null, null]
    };
  }

  function createEmptyLine() {
    var measures = [];
    for (var i = 0; i < MEASURES_PER_LINE; i++) measures.push(createEmptyMeasure());
    return { measures: measures };
  }

  function noteText(cell) {
    if (!cell) return "";
    var t = cell.note;
    if (cell.accidental === "sharp") t += "\u266F";
    if (cell.accidental === "flat") t += "\u266D";
    return t;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  /* ---- Flat-view helpers (treat 32 cells across 4 measures as one array) ---- */

  function getFlat(line, row, globalIdx) {
    var mIdx = Math.floor(globalIdx / CELLS_PER_MEASURE);
    var cIdx = globalIdx % CELLS_PER_MEASURE;
    return line.measures[mIdx][row][cIdx];
  }

  function setFlat(line, row, globalIdx, value) {
    var mIdx = Math.floor(globalIdx / CELLS_PER_MEASURE);
    var cIdx = globalIdx % CELLS_PER_MEASURE;
    line.measures[mIdx][row][cIdx] = value;
  }

  function toGlobal(measureIdx, cellIdx) {
    return measureIdx * CELLS_PER_MEASURE + cellIdx;
  }

  function findSpanOwnerFlat(line, row, globalIdx) {
    for (var j = globalIdx - 1; j >= 0; j--) {
      var c = getFlat(line, row, j);
      if (c !== null) {
        if (j + c.span > globalIdx) return j;
        return -1;
      }
    }
    return -1;
  }

  /* ---- Rendering ---- */

  var $sheet = document.getElementById("sheet");

  function renderSheet() {
    $sheet.textContent = "";
    state.lines.forEach(function (line, lineIdx) {
      $sheet.appendChild(renderLine(line, lineIdx));
    });
  }

  function renderLine(line, lineIdx) {
    var wrap = el("div", "line");

    var chords = el("div", "chord-row");
    line.measures.forEach(function (m, mIdx) {
      var inp = document.createElement("input");
      inp.type = "text";
      inp.className = "chord-input";
      inp.placeholder = "\u2014";
      inp.value = m.chord;
      inp.spellcheck = false;
      inp.addEventListener("input", function () {
        state.lines[lineIdx].measures[mIdx].chord = inp.value;
      });
      chords.appendChild(inp);
    });
    wrap.appendChild(chords);

    wrap.appendChild(renderNoteRow(line, lineIdx, "treble"));
    wrap.appendChild(renderBeatRow());

    wrap.appendChild(renderNoteRow(line, lineIdx, "bass"));
    wrap.appendChild(renderBeatRow());

    var foot = el("div", "line-foot");
    var removeBtn = el("button", "btn btn-sm", "\u2715 Remove");
    removeBtn.addEventListener("click", function () {
      var hasNotes = line.measures.some(function (m) {
        return m.treble.some(Boolean) || m.bass.some(Boolean);
      });
      if (hasNotes && !confirm("This line has notes. Remove it?")) return;
      state.lines.splice(lineIdx, 1);
      if (state.lines.length === 0) state.lines.push(createEmptyLine());
      renderSheet();
    });
    foot.appendChild(removeBtn);
    wrap.appendChild(foot);

    return wrap;
  }

  function renderNoteRow(line, lineIdx, row) {
    var grid = el("div", "note-row");
    for (var g = 0; g < TOTAL_COLS; g++) {
      var cell = getFlat(line, row, g);
      var mIdx = Math.floor(g / CELLS_PER_MEASURE);
      var cIdx = g % CELLS_PER_MEASURE;

      if (cell === null && g > 0) {
        if (findSpanOwnerFlat(line, row, g) !== -1) continue;
      }

      var span = cell ? cell.span : 1;
      var div = el("div", "cell");
      div.style.gridColumn = (g + 1) + " / span " + span;

      if (cell) {
        div.classList.add("has-note");
        var noteSpan = el("span", "note-text", noteText(cell));
        noteSpan.style.width = (100 / span) + "%";
        div.appendChild(noteSpan);

        if (span > 1) {
          for (var offset = 1; offset < span; offset++) {
            if ((g + offset) % CELLS_PER_MEASURE === 0) {
              var divider = el("div", "measure-divider");
              divider.style.left = ((offset / span) * 100) + "%";
              div.appendChild(divider);
            }
          }
        }

        var handle = el("div", "drag-handle");
        (function (h, li, r, mi, ci) {
          h.addEventListener("mousedown", function (e) {
            onDragStart(e, li, r, mi, ci);
          });
        })(handle, lineIdx, row, mIdx, cIdx);
        div.appendChild(handle);
      }

      if (cIdx === 0 && mIdx > 0) div.classList.add("measure-start");

      div.dataset.line = lineIdx;
      div.dataset.row = row;
      div.dataset.measure = mIdx;
      div.dataset.cell = cIdx;

      (function (d, li, r, mi, ci, c) {
        d.addEventListener("click", function (e) {
          e.stopPropagation();
          hidePopup();
          if (!c) {
            deselectCell();
            showPopup(d, li, r, mi, ci);
          } else {
            selectCell(li, r, mi, ci);
          }
        });
      })(div, lineIdx, row, mIdx, cIdx, cell);

      grid.appendChild(div);
    }
    return grid;
  }

  function renderBeatRow() {
    var grid = el("div", "beat-row");
    for (var m = 0; m < MEASURES_PER_LINE; m++) {
      for (var i = 0; i < CELLS_PER_MEASURE; i++) {
        var lbl = el("div", "beat-label", BEAT_LABELS[i]);
        lbl.style.gridColumn = String(m * CELLS_PER_MEASURE + i + 1);
        if (i === 0 && m > 0) lbl.classList.add("measure-start");
        grid.appendChild(lbl);
      }
    }
    return grid;
  }

  /* ---- Selection ---- */

  function selectCell(lineIdx, row, measureIdx, cellIdx) {
    deselectCell();
    selected = { lineIdx: lineIdx, row: row, measureIdx: measureIdx, cellIdx: cellIdx };
    var el = findCellEl(lineIdx, row, measureIdx, cellIdx);
    if (el) el.classList.add("selected");
  }

  function deselectCell() {
    if (selected) {
      var el = findCellEl(selected.lineIdx, selected.row, selected.measureIdx, selected.cellIdx);
      if (el) el.classList.remove("selected");
    }
    selected = null;
  }

  function findCellEl(lineIdx, row, measureIdx, cellIdx) {
    return document.querySelector(
      '.cell[data-line="' + lineIdx + '"][data-row="' + row +
      '"][data-measure="' + measureIdx + '"][data-cell="' + cellIdx + '"]'
    );
  }

  function deleteSelected() {
    if (!selected) return;
    var s = selected;
    var line = state.lines[s.lineIdx];
    var globalStart = toGlobal(s.measureIdx, s.cellIdx);
    var cell = getFlat(line, s.row, globalStart);
    if (!cell) return;
    for (var i = 0; i < cell.span; i++) {
      setFlat(line, s.row, globalStart + i, null);
    }
    deselectCell();
    renderSheet();
  }

  /* ---- Drag to extend/shrink ---- */

  var dragging = null;

  function onDragStart(e, lineIdx, row, measureIdx, cellIdx) {
    e.preventDefault();
    e.stopPropagation();
    var cell = state.lines[lineIdx].measures[measureIdx][row][cellIdx];
    if (!cell) return;
    dragging = {
      lineIdx: lineIdx, row: row, measureIdx: measureIdx,
      cellIdx: cellIdx, startX: e.clientX, startSpan: cell.span
    };
    selectCell(lineIdx, row, measureIdx, cellIdx);
    document.addEventListener("mousemove", onDragMove);
    document.addEventListener("mouseup", onDragEnd);
  }

  function onDragMove(e) {
    if (!dragging) return;
    var d = dragging;
    var line = state.lines[d.lineIdx];
    var globalStart = toGlobal(d.measureIdx, d.cellIdx);
    var cellEl = findCellEl(d.lineIdx, d.row, d.measureIdx, d.cellIdx);
    if (!cellEl) return;

    var cellWidth = cellEl.offsetWidth / d.startSpan;
    if (cellWidth < 1) cellWidth = 20;
    var dx = e.clientX - d.startX;
    var delta = Math.round(dx / cellWidth);
    var newSpan = Math.max(1, d.startSpan + delta);

    var maxSpan = TOTAL_COLS - globalStart;
    newSpan = Math.min(newSpan, maxSpan);

    for (var i = globalStart + d.startSpan; i < globalStart + newSpan; i++) {
      var c = getFlat(line, d.row, i);
      if (c !== null) { newSpan = i - globalStart; break; }
    }

    if (newSpan < 1) newSpan = 1;

    getFlat(line, d.row, globalStart).span = newSpan;

    for (var j = globalStart + 1; j < globalStart + newSpan; j++) {
      setFlat(line, d.row, j, null);
    }
    for (var k = globalStart + newSpan; k < globalStart + d.startSpan; k++) {
      setFlat(line, d.row, k, null);
    }

    renderSheet();
    selectCell(d.lineIdx, d.row, d.measureIdx, d.cellIdx);
  }

  function onDragEnd() {
    dragging = null;
    document.removeEventListener("mousemove", onDragMove);
    document.removeEventListener("mouseup", onDragEnd);
  }

  /* ---- Popup ---- */

  var NOTES = ["C", "D", "E", "F", "G", "A", "B"];
  var $popup = document.getElementById("popup");
  var $popupNotes = document.getElementById("popup-notes");
  var popupTarget = null;
  var popupAccidental = null;

  function showPopup(cellEl, lineIdx, row, measureIdx, cellIdx) {
    popupTarget = { lineIdx: lineIdx, row: row, measureIdx: measureIdx, cellIdx: cellIdx };
    popupAccidental = null;
    updateAccidentalButtons();

    $popupNotes.textContent = "";
    NOTES.forEach(function (n) {
      var btn = el("button", "popup-note", n);
      btn.type = "button";
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        enterNote(n);
      });
      $popupNotes.appendChild(btn);
    });

    var rect = cellEl.getBoundingClientRect();
    $popup.hidden = false;
    var popRect = $popup.getBoundingClientRect();
    var left = rect.left;
    var top = rect.bottom + 4;
    if (left + popRect.width > window.innerWidth) left = window.innerWidth - popRect.width - 8;
    if (top + popRect.height > window.innerHeight) top = rect.top - popRect.height - 4;
    $popup.style.left = left + "px";
    $popup.style.top = top + "px";
  }

  function hidePopup() {
    $popup.hidden = true;
    popupTarget = null;
  }

  function enterNote(noteName) {
    if (!popupTarget) return;
    var t = popupTarget;
    var cells = state.lines[t.lineIdx].measures[t.measureIdx][t.row];
    cells[t.cellIdx] = { note: noteName, accidental: popupAccidental, span: 1 };
    hidePopup();
    renderSheet();
  }

  function updateAccidentalButtons() {
    document.getElementById("acc-natural").classList.toggle("active", popupAccidental === null);
    document.getElementById("acc-sharp").classList.toggle("active", popupAccidental === "sharp");
    document.getElementById("acc-flat").classList.toggle("active", popupAccidental === "flat");
  }

  document.getElementById("acc-natural").addEventListener("click", function (e) {
    e.stopPropagation();
    popupAccidental = null;
    updateAccidentalButtons();
  });
  document.getElementById("acc-sharp").addEventListener("click", function (e) {
    e.stopPropagation();
    popupAccidental = "sharp";
    updateAccidentalButtons();
  });
  document.getElementById("acc-flat").addEventListener("click", function (e) {
    e.stopPropagation();
    popupAccidental = "flat";
    updateAccidentalButtons();
  });

  /* ---- Export / Import ---- */

  function exportJSON() {
    var text = JSON.stringify(state, null, 2) + "\n";
    var slug = (state.title || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    var name = slug + "-sheet.json";

    if (window.showSaveFilePicker) {
      window.showSaveFilePicker({
        suggestedName: name,
        types: [{
          description: "JSON files",
          accept: { "application/json": [".json"] }
        }]
      }).then(function (handle) {
        return handle.createWritable().then(function (writable) {
          return writable.write(text).then(function () {
            return writable.close();
          });
        });
      }).catch(function (err) {
        if (err.name !== "AbortError") showError("Save failed: " + err.message);
      });
    } else {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }

  function importJSON(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
      } catch (e) {
        showError("Invalid JSON: " + e.message);
        return;
      }
      if (!validateSheet(data)) return;
      state.title = data.title || "";
      state.lines = data.lines;
      document.getElementById("title-input").value = state.title;
      clearError();
      renderSheet();
    };
    reader.onerror = function () { showError("Could not read file."); };
    reader.readAsText(file);
  }

  function validateSheet(data) {
    if (typeof data !== "object" || data === null || !Array.isArray(data.lines)) {
      showError("Invalid sheet file: missing 'lines' array.");
      return false;
    }
    for (var i = 0; i < data.lines.length; i++) {
      var line = data.lines[i];
      if (!Array.isArray(line.measures) || line.measures.length !== 4) {
        showError("Invalid sheet file: line " + (i + 1) + " must have exactly 4 measures.");
        return false;
      }
      for (var j = 0; j < line.measures.length; j++) {
        var m = line.measures[j];
        if (!Array.isArray(m.treble) || m.treble.length !== 8 ||
            !Array.isArray(m.bass) || m.bass.length !== 8) {
          showError("Invalid sheet file: measure " + (j + 1) + " of line " + (i + 1) + " must have 8 treble and 8 bass cells.");
          return false;
        }
      }
    }
    return true;
  }

  var $errorBanner = null;

  function showError(msg) {
    clearError();
    $errorBanner = el("div", "banner error", msg);
    document.getElementById("toolbar").after($errorBanner);
  }

  function clearError() {
    if ($errorBanner) { $errorBanner.remove(); $errorBanner = null; }
  }

  /* ---- View mode toggle ---- */

  var viewMode = false;
  var $modeBar = document.getElementById("mode-bar");
  var $viewTitle = document.getElementById("view-title");

  function setViewMode(on) {
    viewMode = on;
    if (on) {
      hidePopup();
      deselectCell();
      document.body.classList.add("view-mode");
      $modeBar.hidden = false;
      $viewTitle.textContent = state.title || "Untitled";
      $viewTitle.hidden = false;
    } else {
      document.body.classList.remove("view-mode");
      $modeBar.hidden = true;
      $viewTitle.hidden = true;
    }
  }

  document.getElementById("view-btn").addEventListener("click", function () {
    setViewMode(true);
  });

  document.getElementById("edit-btn").addEventListener("click", function () {
    setViewMode(false);
  });

  /* ---- Print via hidden iframe ---- */

  function buildPrintHTML() {
    var title = state.title || "Untitled";
    var css = [
      '@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap");',
      "@page { margin: 0; }",
      "* { box-sizing: border-box; margin: 0; padding: 0; }",
      "body { font-family: 'IBM Plex Sans', sans-serif; color: #131B24; background: #fff; padding: 15mm; }",
      "h1 { font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 28px; text-align: center; margin-bottom: 18px; letter-spacing: -.01em; }",
      ".line { margin-bottom: 16px; page-break-inside: avoid; }",
      ".chord-row { display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px 0 0; }",
      ".chord-label { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 600; text-align: center; padding: 2px 8px; }",
      ".note-row { display: grid; grid-template-columns: repeat(32, 1fr); min-height: 30px; }",
      ".cell { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; border: 1px solid #D6DDE5; border-right: none; padding: 6px 0; text-align: left; position: relative; min-height: 30px; background: #fff; }",
      ".cell:last-child { border-right: 1px solid #D6DDE5; }",
      ".cell.measure-start { border-left: 2px solid #5C6B7A; }",
      ".cell.has-note { background: #fff; }",
      ".note-text { display: inline-block; text-align: center; }",
      ".measure-divider { position: absolute; top: 0; bottom: 0; width: 1px; border-left: 1px dashed #5C6B7A; opacity: 0.5; }",
      ".beat-row { display: grid; grid-template-columns: repeat(32, 1fr); }",
      ".beat-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #5C6B7A; text-align: center; padding: 1px 0 5px; }",
      ".beat-label.measure-start { border-left: 2px solid transparent; }"
    ].join("\n");

    var html = '<!doctype html><html><head><meta charset="utf-8"><title></title><style>' + css + '</style></head><body>';
    html += '<h1>' + escapeHTML(title) + '</h1>';

    state.lines.forEach(function (line) {
      html += '<div class="line">';

      // Chord row
      html += '<div class="chord-row">';
      line.measures.forEach(function (m) {
        html += '<div class="chord-label">' + escapeHTML(m.chord || "\u2014") + '</div>';
      });
      html += '</div>';

      // Treble + beats
      html += buildPrintNoteRow(line, "treble");
      html += buildPrintBeatRow();

      // Bass + beats
      html += buildPrintNoteRow(line, "bass");
      html += buildPrintBeatRow();

      html += '</div>';
    });

    html += '</body></html>';
    return html;
  }

  function buildPrintNoteRow(line, row) {
    var h = '<div class="note-row">';
    for (var g = 0; g < TOTAL_COLS; g++) {
      var cell = getFlat(line, row, g);
      var mIdx = Math.floor(g / CELLS_PER_MEASURE);
      var cIdx = g % CELLS_PER_MEASURE;

      if (cell === null && g > 0) {
        if (findSpanOwnerFlat(line, row, g) !== -1) continue;
      }

      var span = cell ? cell.span : 1;
      var cls = "cell";
      if (cell) cls += " has-note";
      if (cIdx === 0 && mIdx > 0) cls += " measure-start";

      h += '<div class="' + cls + '" style="grid-column:' + (g + 1) + '/span ' + span + '">';

      if (cell) {
        h += '<span class="note-text" style="width:' + (100 / span) + '%">' + escapeHTML(noteText(cell)) + '</span>';

        if (span > 1) {
          for (var offset = 1; offset < span; offset++) {
            if ((g + offset) % CELLS_PER_MEASURE === 0) {
              h += '<div class="measure-divider" style="left:' + ((offset / span) * 100) + '%"></div>';
            }
          }
        }
      }

      h += '</div>';
    }
    h += '</div>';
    return h;
  }

  function buildPrintBeatRow() {
    var h = '<div class="beat-row">';
    for (var m = 0; m < MEASURES_PER_LINE; m++) {
      for (var i = 0; i < CELLS_PER_MEASURE; i++) {
        var cls = "beat-label";
        if (i === 0 && m > 0) cls += " measure-start";
        h += '<div class="' + cls + '" style="grid-column:' + (m * CELLS_PER_MEASURE + i + 1) + '">' + BEAT_LABELS[i] + '</div>';
      }
    }
    h += '</div>';
    return h;
  }

  function escapeHTML(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var printFrame = null;

  function printSheet() {
    if (!printFrame) {
      printFrame = document.createElement("iframe");
      printFrame.style.cssText = "position:absolute;width:0;height:0;border:none;left:-9999px;";
      document.body.appendChild(printFrame);
    }

    var html = buildPrintHTML();
    var doc = printFrame.contentDocument || printFrame.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();

    // Wait for fonts to load before printing
    if (printFrame.contentWindow.document.fonts && printFrame.contentWindow.document.fonts.ready) {
      printFrame.contentWindow.document.fonts.ready.then(function () {
        printFrame.contentWindow.print();
      });
    } else {
      setTimeout(function () {
        printFrame.contentWindow.print();
      }, 500);
    }
  }

  document.getElementById("print-btn").addEventListener("click", printSheet);

  /* ---- Init ---- */

  document.getElementById("title-input").addEventListener("input", function () {
    state.title = this.value;
  });

  document.getElementById("add-line").addEventListener("click", function () {
    state.lines.push(createEmptyLine());
    renderSheet();
  });

  document.getElementById("export-btn").addEventListener("click", exportJSON);

  document.getElementById("import-file").addEventListener("change", function (e) {
    if (e.target.files && e.target.files[0]) {
      importJSON(e.target.files[0]);
      e.target.value = "";
    }
  });

  state.lines.push(createEmptyLine());
  renderSheet();

  document.addEventListener("click", function () {
    hidePopup();
    deselectCell();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      hidePopup();
      deselectCell();
    }
    if (e.key === "Delete" || e.key === "Backspace") {
      if (selected) {
        e.preventDefault();
        deleteSelected();
      }
    }
  });
})();
</script>

</body>
</html>
